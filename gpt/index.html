<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#1973a2" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%231c7097%27/%3E%3Cpath d=%27M5 21h22l-5 6H10ZM17 5v15H7Z%27 fill=%27%23eadab1%27/%3E%3C/svg%3E"
    />
    <title>독도까지 · 한국어 웹판</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="preload"
      href="fonts/korean.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <main id="game">
      <canvas
        id="ocean"
        aria-label="드래그로 조종하고 두 번 눌러 자동 항해합니다."
        tabindex="0"
      ></canvas>
      <div id="boot">
        <div class="loader"></div>
        <p>푸른 바다를 준비하고 있습니다.</p>
        <small>한국어 글꼴 · 항로 · 선박</small>
      </div>
      <div id="title" hidden>
        <div class="titlemark">
          <svg viewBox="0 0 270 95" aria-hidden="true">
            <path
              d="M10 78L65 29L91 51L135 9L183 76M156 77L198 33L252 79M66 14q5-8 10 0q5-8 10 0M214 16q5-8 10 0q5-8 10 0"
            />
          </svg>
          <div class="titleRibbon"><h1>독도까지</h1></div>
          <p>배 키우기</p>
        </div>
        <button id="startGame">터치해서 시작하기</button
        ><small>한국어 웹 재구성 · 기록은 이 브라우저에 저장됩니다.</small>
      </div>
      <div id="hud" hidden>
        <section id="resources" aria-label="보유 자원"></section>
        <div class="topright">
          <button id="openMap" class="iconbtn" aria-label="해도">
            <svg viewBox="0 0 32 32">
              <path d="M3 8l8-4 10 4 8-4v23l-8 4-10-4-8 4ZM11 4v23M21 8v23" />
            </svg></button
          ><button id="openSettings" class="iconbtn" aria-label="설정">
            <svg viewBox="0 0 32 32">
              <path
                d="M13 3h6l1 5 4-2 4 5-4 4 5 2-2 6-5-1-1 6h-6l-1-5-5 2-4-5 4-4-5-3 3-5 5 1Z"
              />
              <circle cx="16" cy="16" r="5" />
            </svg></button
          ><button id="miniButton" aria-label="미니맵 확대">
            <canvas id="mini" width="200" height="200"></canvas
            ><span>북</span></button
          ><button
            id="changeWorld"
            class="iconbtn"
            aria-label="다른 바다로 이동"
          >
            <svg viewBox="0 0 32 32">
              <circle cx="16" cy="16" r="12" />
              <path d="M4 16h24M16 4q-13 12 0 24q13-12 0-24M7 9h18M7 23h18" />
            </svg>
          </button>
        </div>
        <div class="location">
          <b id="islandName">크로커다일</b><span id="islandInfo"></span>
        </div>
        <div id="targetHint"></div>
        <div id="toast" role="status"></div>
        <div id="floatLayer"></div>
        <div id="shipHealth">
          <div id="hpLabel"></div>
          <div class="bar"><i></i></div>
        </div>
        <div id="sailingTools">
          <button id="stopBoat">멈추기</button
          ><button id="dockBoat">정박</button
          ><button id="arenaButton">아레나</button
          ><small id="sailingStatus"
            >드래그로 이동 · 두 번 눌러 자동 항해</small
          >
        </div>
        <div id="joystick" hidden><i></i></div>
        <section id="portPanel" hidden>
          <div class="portTop">
            <div>
              <small>나의 항구</small>
              <h2 id="portName">크로커다일</h2>
            </div>
            <div id="repairLabel"></div>
            <button id="depart">출항 <span>›</span></button>
          </div>
          <nav id="portTabs">
            <button data-tab="upgrade" class="active">선착장</button
            ><button data-tab="market">시장</button
            ><button data-tab="crew">조수</button>
          </nav>
          <div id="portBody"></div>
        </section>
      </div>
      <div id="modalShade" hidden>
        <section
          id="modal"
          role="dialog"
          aria-modal="true"
          aria-labelledby="modalTitle"
        >
          <header>
            <h2 id="modalTitle"></h2>
            <button id="closeModal" aria-label="닫기">×</button>
          </header>
          <div id="modalBody"></div>
        </section>
      </div>
      <div id="fatal" hidden></div>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
